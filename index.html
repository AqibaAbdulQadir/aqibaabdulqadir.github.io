    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            transition: background-color 0.25s ease, color 0.25s ease;
            overflow: hidden;
            background-color: #121212;
            color: #e0e0e0;
        }

        /* Fixed gradient panel */
        #panel-bg {
            position: fixed;
            inset: 5rem;
            z-index: 0;
            overflow: hidden;
            border-radius: 1.5rem;
            pointer-events: none;
            transition: background-color 0.25s ease;
            background-color: #1a1a1a;
        }

        #panel-glow {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            filter: none;
            transform: none;
            background: transparent;
        }

        /* Content stays inside the gradient panel */
        #app {
            position: fixed;
            inset: 5rem;
            z-index: 10;
            width: auto;
            max-width: none;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            border-radius: 1.5rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(120, 120, 120, 0.35) transparent;
        }

        #app::-webkit-scrollbar {
            width: 5px;
        }

        #app::-webkit-scrollbar-track {
            background: transparent;
        }

        #app::-webkit-scrollbar-thumb {
            background: rgba(120, 120, 120, 0.35);
            border-radius: 999px;
        }

        /* Keep the original narrow editorial content width */
        .page-content {
            width: 100%;
            max-width: 42rem;
            min-height: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        /* ---- Lightbox ---- */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(6px);
            padding: 2rem;
            cursor: zoom-out;
            animation: lb-fade 0.2s ease;
        }

        #lightbox.open {
            display: flex;
        }

        #lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: lb-zoom 0.25s ease;
        }

        #lightbox-caption {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #d6d3d1;
            letter-spacing: 0.05em;
        }

        @keyframes lb-fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes lb-zoom {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Comfortable panel spacing on smaller screens */
        @media (max-width: 640px) {

            #panel-bg,
            #app {
                inset: 4.5rem 1rem 1rem;
                border-radius: 1.25rem;
            }

            #app {
                padding: 2rem 1.25rem;
            }
        }

        @media (max-height: 500px) and (min-width: 641px) {

            #panel-bg,
            #app {
                inset-top: 4rem;
                inset-bottom: 1rem;
            }
        }
    </style>
</head>

        /* =========================
           CONTACT FORM
        ========================= */

        function handleContactSubmit(event) {
            event.preventDefault();

            const statusElem = document.getElementById('msg-status');

            if (statusElem) {
                statusElem.classList.remove('hidden');
            }

            event.target.reset();
        }

        function openLightbox(src, caption) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const cap = document.getElementById('lightbox-caption');
            img.src = src;
            img.alt = caption || '';
            cap.textContent = caption || '';
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('open');
            document.body.style.overflow = '';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

           INITIALIZATION
        ========================= */
